spring.application.name=neodemanda

server.port=8080

# DevTools: reinicio automatico ao recompilar as classes
spring.devtools.restart.enabled=true

# Banco em memoria temporario: existe apenas para a aplicacao subir com JPA
# ativo enquanto o banco oficial nao e definido. Os dados sao perdidos a cada
# reinicio.
spring.datasource.url=jdbc:h2:mem:neodemanda;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Hibernate cria o schema a partir das entidades; trocar por migracao versionada
# (Flyway/Liquibase) quando o banco oficial entrar.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
